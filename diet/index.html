<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dieta · Leticia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#181310;--bg-2:#211a14;--card:#261f17;--card-2:#2e251a;
  --border:#3d3226;--border-glow:#4f4130;--text:#f8f1e4;--text-2:#c3ac8b;--text-3:#8a7a5e;
  --accent:#ffb020;--accent-2:#ff7a29;--teal:#ffcf5c;--amber:#ff5b3d;
  --radius:16px;--radius-sm:11px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(255,176,32,.14), transparent 55%),
    radial-gradient(1000px 500px at 0% 10%, rgba(255,122,41,.10), transparent 50%),
    var(--bg);
  color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:840px;margin:0 auto;padding:2.2rem 1.5rem 4rem}
.top{display:flex;align-items:center;gap:14px;margin-bottom:1.4rem}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 8px 24px rgba(255,176,32,.3);flex-shrink:0}
.top h1{font-size:21px;font-weight:700;letter-spacing:-.02em}
.top p{font-size:12.5px;color:var(--text-2);margin-top:2px}

.day-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.4rem}
.day-tab{flex:1;min-width:56px;padding:10px 6px;border-radius:12px;cursor:pointer;text-align:center;background:var(--card);border:1px solid var(--border);transition:all .2s}
.day-tab:hover{border-color:var(--border-glow);background:var(--card-2)}
.day-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none}
.day-tab b{font-size:13px;font-weight:700;display:block}
.day-tab span{font-size:10px;color:var(--text-3)}
.day-tab.active b,.day-tab.active span{color:#231a08}
.day-tab.today{position:relative}
.day-tab.today::after{content:'';position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--teal)}

.day-head{margin-bottom:1.3rem}
.day-head h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.day-head p{font-size:12.5px;color:var(--text-2);margin-top:3px;display:flex;align-items:center;gap:8px}
.day-head .badge{font-size:10.5px;font-weight:700;color:var(--teal);background:rgba(255,207,92,.14);padding:3px 10px;border-radius:20px;border:1px solid rgba(255,207,92,.3)}
.mode-toggle{display:flex;gap:8px;margin-top:.9rem}
.mode-btn{flex:1;padding:10px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text-2);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:7px}
.mode-btn:hover{border-color:var(--border-glow);color:var(--text)}
.mode-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#231a08}

.meal{background:linear-gradient(160deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem 1.3rem;margin-bottom:1rem}
.meal-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:.9rem;padding-bottom:.9rem;border-bottom:1px solid var(--border)}
.meal-body{flex:1;min-width:0}
.m-time{font-size:11px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.m-title{font-size:15px;font-weight:700}
.m-kcal{font-size:13px;font-weight:700;color:var(--amber);flex-shrink:0;white-space:nowrap}

.food-lines{display:flex;flex-direction:column;gap:14px;margin-bottom:.9rem}
.food-line{font-size:13px;color:var(--text-2);line-height:1.6}
.food-line b{color:var(--text);font-weight:600}
.food-line .kc{color:var(--text-3);font-size:11.5px}

.choice-group{}
.choice-title{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.choice-title .choice-sub{text-transform:none;font-weight:500;letter-spacing:0;color:var(--text-3);opacity:.8}
.choice-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.choice-list li{display:flex;align-items:baseline;gap:9px;font-size:13px;color:var(--text);padding:6px 10px;border-radius:9px;background:var(--bg-2);border:1px solid var(--border)}
.choice-tag{flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:.03em;color:#231a08;background:var(--teal);padding:2px 7px;border-radius:6px;min-width:26px;text-align:center}
.choice-tag.ou{background:transparent;color:var(--text-3);border:1px solid var(--border);}
.choice-list .kc{margin-left:auto;flex-shrink:0;color:var(--amber);font-weight:600;font-size:11.5px;white-space:nowrap}
/* itens clicáveis */
.food-line.click{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:var(--bg-2);border:1px solid var(--border);cursor:pointer;transition:all .15s;color:var(--text)}
.food-line.click:hover{border-color:var(--border-glow)}
.food-line.click .ck{flex-shrink:0;width:20px;height:20px;border-radius:6px;border:1px solid var(--border-glow);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:all .15s}
.food-line.click:not(.off) .ck{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#231a08}
.food-line.click .fl-txt{flex:1;min-width:0}
.food-line.click.off{opacity:.5}
.food-line.click.off .fl-txt{text-decoration:line-through}
.food-line.click .kc{color:var(--amber);font-weight:600;font-size:11.5px;white-space:nowrap;flex-shrink:0}
.sel-list li{cursor:pointer;transition:all .15s;align-items:center}
.sel-list li:hover{border-color:var(--border-glow)}
.sel-list li .radio{flex-shrink:0;width:17px;height:17px;border-radius:50%;border:2px solid var(--border-glow);position:relative;transition:all .15s}
.sel-list li.sel{border-color:var(--accent);background:rgba(255,176,32,.1)}
.sel-list li.sel .radio{border-color:var(--accent)}
.sel-list li.sel .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.sel-list li.sel .kc{color:var(--accent)}
/* gramatura editável */
.qty{display:inline-flex;align-items:center;gap:2px;flex-shrink:0;font-size:11px;color:var(--text-3);cursor:default}
.qty input{width:52px;padding:5px 6px;border-radius:7px;background:var(--card);border:1px solid var(--border-glow);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right;-moz-appearance:textfield}
.qty input:focus{outline:none;border-color:var(--accent)}
.qty.custom input{border-color:var(--accent);color:var(--accent)}
.qty-reset{margin-left:3px;width:20px;height:20px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text-3);cursor:pointer;font-size:9px;display:inline-flex;align-items:center;justify-content:center}
.qty-reset:hover{border-color:var(--accent);color:var(--accent)}
.food-line.click .qty,.sel-list li .qty{margin-left:auto}
.food-line.click .kc,.sel-list li .kc{min-width:64px;text-align:right}
.note-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.note-list li{font-size:12.5px;color:var(--text-2);line-height:1.6;padding-left:18px;position:relative}
.note-list li::before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--teal);opacity:.7}
.note-list li.req::before{background:var(--amber)}

.meal-macros{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);padding-top:.8rem;border-top:1px solid var(--border)}
.meal-macros b{color:var(--text)}
.meal-macros-note{font-size:10.5px;color:var(--text-3);margin-top:5px}

.footer{text-align:center;margin-top:2rem;font-size:11px;color:var(--text-3);line-height:1.6}
.footer b{color:var(--text-2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">🥗</div>
    <div><h1>Dieta</h1><p>Modo Goggins · jejum até 18h · refeição única · alta proteína · Leticia</p></div>
  </div>

  <div class="day-tabs" id="dayTabs"></div>

  <div class="day-head">
    <h2 id="dayTitle"></h2>
    <p id="dayTreino"><span class="badge" id="dayBadge"></span><span id="dayTreinoText"></span></p>
    <div class="mode-toggle">
      <button type="button" class="mode-btn" id="modeTreinoBtn" onclick="setMode('treino')"><i class="fa-solid fa-dumbbell"></i> Treinei</button>
      <button type="button" class="mode-btn" id="modeLivreBtn" onclick="setMode('livre')"><i class="fa-solid fa-couch"></i> Não treinei</button>
    </div>
  </div>

  <div id="mealsWrap"></div>

  <div class="footer"><b>Dieta</b> · calorias pela Tabela TACO (UNICAMP) · clique na proteína pra selecionar e nos itens fixos pra marcar/desmarcar — o total recalcula sozinho · vegetais e fibra são à vontade (não contam)</div>
</div>

<script>
// ===== BASE DE ALIMENTOS (Tabela TACO / UNICAMP, valores por 100g) =====
const FOODS = {
  lombo:          { label:'Lombo Suíno Grelhado',              per100:{kcal:210, p:35.7, c:0.0,  g:6.4} },
  frango:         { label:'Frango Peito Grelhado',             per100:{kcal:159, p:32.0, c:0.0,  g:2.5} },
  frangoSobrecoxa:{ label:'Frango Sobrecoxa (com pele) Assada', per100:{kcal:260, p:28.7, c:0.0,  g:15.2} },
  peixe:          { label:'Peixe Branco Grelhado',             per100:{kcal:96,  p:20.1, c:0.0,  g:1.7} },
  ovo:            { label:'Ovo cozido',                        per100:{kcal:146, p:13.3, c:0.6,  g:9.5} },
  arrozBranco:    { label:'Arroz Branco Cozido',                per100:{kcal:128, p:2.5,  c:28.1, g:0.2} },
  arrozIntegral:  { label:'Arroz Integral Cozido',              per100:{kcal:124, p:2.6,  c:25.8, g:1.0} },
  batataInglesa:  { label:'Batata Inglesa Cozida',              per100:{kcal:52,  p:1.2,  c:11.9, g:0.1} },
  batataDoce:     { label:'Batata Doce Cozida',                 per100:{kcal:77,  p:0.6,  c:18.4, g:0.1} },
  feijao:         { label:'Feijão Carioca Cozido',              per100:{kcal:76,  p:4.8,  c:13.6, g:0.5} },
  abobora:        { label:'Abóbora Cozida',                     per100:{kcal:40,  p:1.4,  c:9.6,  g:0.1} }
};
function foodMacros(key,grams){
  const f=FOODS[key].per100, r=grams/100;
  return {kcal:f.kcal*r, p:f.p*r, c:f.c*r, g:f.g*r};
}
// Meta: 108g proteína/dia (1,8g/kg x 60kg de massa magra), igual em dias com treino e sem treino.
// Modo Goggins: jejum até 18h (só café preto) e refeição única às 18h, sem pão,
// carboidrato só em dia de treino. Treino ~1.000 kcal, sem treino ~810 kcal.
const PROT_TREINO = {lombo:225, frango:245, peixe:395};
const PROT_LIVRE  = {lombo:260, frango:280, peixe:460};

// ===== DIAS =====
const reqVeg=(txt)=>({text:`Vegetais (obrigatório): ${txt}`,req:true});
const reqFibra={text:'Fibra (obrigatório): 1 colher de sopa de psyllium em 400ml água',req:true};

function proteinChoices(prot){
  return [
    {key:'lombo',grams:prot.lombo,label:`${prot.lombo}g de Lombo Suíno Grelhado`},
    {key:'frango',grams:prot.frango,label:`${prot.frango}g de Frango Peito Grelhado`},
    {key:'frangoSobrecoxa',grams:prot.frango,label:`${prot.frango}g de Frango Sobrecoxa (com pele) Assada`},
    {key:'peixe',grams:prot.peixe,label:`${prot.peixe}g de Peixe Branco Grelhado`}
  ];
}
function jejumMeal(){
  return { time:'Até 18:00', title:'Jejum',
    freeNotes:[
      {text:'Só café preto sem açúcar (e água à vontade) — nada de café depois das 14h'},
      {text:'Eletrólitos todo dia: sal na comida, potássio e magnésio',req:true},
      {text:'Dia de muita fome: pode comer os 3 ovos cozidos antes (de preferência logo após a musculação) e tirar eles da refeição das 18h'}
    ] };
}
function refeicaoUnicaMeal(prot, opts){
  const m = { time:'18:00', title:'Refeição única',
    eggsFixed:{grams:150,label:'3 ovos inteiros (cozidos ou mexidos, sem óleo extra)'},
    protein:{choices:proteinChoices(prot)},
    feijao:{grams:60},
    freeNotes:[reqVeg('2-4 xícaras de vegetais cozidos e/ou salada crua à vontade'), reqFibra] };
  if(opts && opts.rice) m.rice = {grams:opts.rice}; // arroz só nos dias de treino
  return m;
}

// Refeição única às 18h. Dia de treino ganha 100g de arroz branco; sem treino é sem carbo (o carb ~9g vem só do feijão + ovos).
const mealsLivre     = [jejumMeal(), refeicaoUnicaMeal(PROT_LIVRE, null)];
const mealsTreinoAll = [jejumMeal(), refeicaoUnicaMeal(PROT_TREINO, {rice:100})];

const DAYS = [
 {key:'seg', label:'Segunda', short:'SEG', treinoDesc:'Jiu Jitsu + Musculação + Esteira', defaultMode:'treino', mealsTreino:mealsTreinoAll},
 {key:'ter', label:'Terça',   short:'TER', treinoDesc:'Dia de treino',            defaultMode:'treino', mealsTreino:mealsTreinoAll},
 {key:'qua', label:'Quarta',  short:'QUA', treinoDesc:'Dia de treino',            defaultMode:'treino', mealsTreino:mealsTreinoAll},
 {key:'qui', label:'Quinta',  short:'QUI', treinoDesc:'Dia de treino',            defaultMode:'treino', mealsTreino:mealsTreinoAll},
 {key:'sex', label:'Sexta',   short:'SEX', treinoDesc:'Musculação',               defaultMode:'treino', mealsTreino:mealsTreinoAll},
 {key:'sab', label:'Sábado',  short:'SÁB', treinoDesc:'Treinou no fim de semana', defaultMode:'livre',  mealsTreino:mealsTreinoAll},
 {key:'dom', label:'Domingo', short:'DOM', treinoDesc:'Treinou no fim de semana', defaultMode:'livre',  mealsTreino:mealsTreinoAll}
];

// ===== SELEÇÃO INTERATIVA + CÁLCULO AO VIVO =====
function altKcal(key,grams){ return Math.round(foodMacros(key,grams).kcal); }

const SEL_KEY='diet_sel_v1';
let sel={};
try{ sel=JSON.parse(localStorage.getItem(SEL_KEY)||'{}'); }catch(e){ sel={}; }
function daySel(){ const k=DAYS[curIdx].key; if(!sel[k]) sel[k]={prot:0,eggs:true,feijao:true,rice:true}; if(sel[k].rice===undefined)sel[k].rice=true; return sel[k]; }
function saveSel(){ try{ localStorage.setItem(SEL_KEY, JSON.stringify(sel)); }catch(e){} }
function pickProt(i){ daySel().prot=i; saveSel(); renderAll(); }
function toggleItem(which){ const s=daySel(); s[which]=!s[which]; saveSel(); renderAll(); }
// gramatura editável: usa a do plano por padrão, ou o override que você digitar
function gramsFor(gKey, def){ const s=daySel(); return (s.g && s.g[gKey]!=null) ? s.g[gKey] : def; }
function isCustom(gKey){ const s=daySel(); return !!(s.g && s.g[gKey]!=null); }
function setGrams(gKey, val){
  const s=daySel(); if(!s.g)s.g={};
  const n=parseInt(val,10);
  if(isNaN(n)||n<0) delete s.g[gKey]; else s.g[gKey]=n;
  saveSel(); recalcLive(); // atualiza kcal/total sem recriar o input (não perde o foco enquanto digita)
}
function resetGrams(gKey){ const s=daySel(); if(s.g)delete s.g[gKey]; saveSel(); renderAll(); }
// atualiza os números ao vivo (chamado a cada tecla), sem re-render que perderia o foco
function recalcLive(){
  const meals=curMeals(DAYS[curIdx]);
  document.querySelectorAll('#mealsWrap .meal').forEach((mealEl,mi)=>{
    const meal=meals[mi]; if(!meal||!(meal.eggsFixed||meal.protein))return;
    mealEl.querySelectorAll('.kc[data-kc]').forEach(sp=>{
      sp.textContent=altKcal(sp.dataset.food, gramsFor(sp.dataset.kc, +sp.dataset.def))+' kcal';
    });
    const mac=selectedMacros(meal);
    const kcEl=mealEl.querySelector('.m-kcal'); if(kcEl)kcEl.textContent=mac.kcal+' kcal';
    const b=mealEl.querySelectorAll('.meal-macros b');
    if(b.length>=3){ b[0].textContent=mac.p+'g'; b[1].textContent=mac.c+'g'; b[2].textContent=mac.g+'g'; }
  });
}

// total da refeição conforme o que está selecionado/marcado/gramatura
function selectedMacros(meal){
  const s=daySel();
  let t={kcal:0,p:0,c:0,g:0};
  const add=(key,grams)=>{const m=foodMacros(key,grams);t.kcal+=m.kcal;t.p+=m.p;t.c+=m.c;t.g+=m.g;};
  if(meal.eggsFixed && s.eggs) add('ovo', gramsFor('eggs', meal.eggsFixed.grams));
  if(meal.protein){ const c=meal.protein.choices[s.prot]||meal.protein.choices[0]; add(c.key, gramsFor('prot:'+c.key, c.grams)); }
  if(meal.rice && s.rice!==false) add('arrozBranco', gramsFor('rice', meal.rice.grams));
  if(meal.feijao && s.feijao) add('feijao', gramsFor('feijao', meal.feijao.grams));
  return { kcal:Math.round(t.kcal), p:Math.round(t.p*10)/10, c:Math.round(t.c*10)/10, g:Math.round(t.g*10)/10 };
}
function qtyInput(gKey, def){
  const g=gramsFor(gKey, def);
  const cust=isCustom(gKey);
  return `<span class="qty${cust?' custom':''}" onclick="event.stopPropagation()">
    <input type="number" min="0" step="5" value="${g}" oninput="setGrams('${gKey}',this.value)" onchange="renderMeals(DAYS[curIdx])">g${cust?`<button class="qty-reset" title="Voltar ao plano (${def}g)" onclick="resetGrams('${gKey}')"><i class="fa-solid fa-rotate-left"></i></button>`:''}
  </span>`;
}
function checkRow(label, foodKey, gKey, defG, on, which){
  const kc=altKcal(foodKey, gramsFor(gKey, defG));
  return `<div class="food-line click${on?'':' off'}" onclick="toggleItem('${which}')">
    <span class="ck"><i class="fa-solid fa-check"></i></span>
    <span class="fl-txt">${label}</span>
    ${qtyInput(gKey, defG)}
    <span class="kc" data-kc="${gKey}" data-food="${foodKey}" data-def="${defG}">${kc} kcal</span>
  </div>`;
}
function proteinBlock(choices){
  const s=daySel();
  const items=choices.map((c,i)=>{
    const kc=altKcal(c.key, gramsFor('prot:'+c.key, c.grams));
    return `<li class="${i===s.prot?'sel':''}" onclick="pickProt(${i})">
      <span class="radio"></span>
      <span class="fl-txt">${FOODS[c.key].label}</span>
      ${qtyInput('prot:'+c.key, c.grams)}
      <span class="kc" data-kc="prot:${c.key}" data-food="${c.key}" data-def="${c.grams}">${kc} kcal</span>
    </li>`;
  }).join('');
  return `<div class="choice-group">
    <div class="choice-title">Proteína <span class="choice-sub">(escolha 1 · clique pra selecionar · edite os gramas)</span></div>
    <ul class="choice-list sel-list">${items}</ul>
  </div>`;
}

// ===== RENDER (somente leitura) =====
const tabsEl=document.getElementById('dayTabs');
const mealsWrap=document.getElementById('mealsWrap');
function jsWeekdayToKey(d){return ['dom','seg','ter','qua','qui','sex','sab'][d]}
const TODAY_KEY = jsWeekdayToKey(new Date().getDay());
let curIdx = DAYS.findIndex(d=>d.key===TODAY_KEY);
if(curIdx<0) curIdx=0;

// modo (treino/livre) escolhido pra cada dia — começa no padrão, mas qualquer dia pode virar o outro
let dayMode = {};
DAYS.forEach(d=>{ dayMode[d.key]=d.defaultMode; });
function curMode(day){ return dayMode[day.key]||day.defaultMode; }
function curMeals(day){ return curMode(day)==='treino' ? day.mealsTreino : mealsLivre; }
function setMode(mode){
  dayMode[DAYS[curIdx].key]=mode;
  renderAll();
}

function renderTabs(){
  tabsEl.innerHTML=DAYS.map((d,i)=>`<div class="day-tab${i===curIdx?' active':''}${d.key===TODAY_KEY?' today':''}" onclick="pick(${i})">
      <b>${d.short}</b><span>${curMode(d)==='treino'?'treino':'livre'}</span>
    </div>`).join('');
}
function renderHead(day){
  const mode=curMode(day);
  document.getElementById('dayTitle').textContent = day.label + (day.key===TODAY_KEY?' · hoje':'');
  document.getElementById('dayBadge').textContent = mode==='treino' ? 'Dia de treino' : 'Sem treino';
  document.getElementById('dayTreinoText').textContent = mode==='treino' ? day.treinoDesc : 'Dia livre / descanso';
  document.getElementById('modeTreinoBtn').classList.toggle('active', mode==='treino');
  document.getElementById('modeLivreBtn').classList.toggle('active', mode==='livre');
}
function renderMeals(day){
  const meals = curMeals(day);
  mealsWrap.innerHTML = meals.map(meal=>{
    const isMeal = !!(meal.eggsFixed||meal.protein);
    const mac = isMeal ? selectedMacros(meal) : {kcal:0,p:0,c:0,g:0};
    const s = daySel();
    let lines='';
    if(meal.eggsFixed) lines+=checkRow(meal.eggsFixed.label, 'ovo', 'eggs', meal.eggsFixed.grams, s.eggs, 'eggs');
    if(meal.protein) lines+=proteinBlock(meal.protein.choices);
    if(meal.rice) lines+=checkRow('Arroz Branco Cozido (dia de treino)', 'arrozBranco', 'rice', meal.rice.grams, s.rice!==false, 'rice');
    if(meal.feijao) lines+=checkRow('Feijão Carioca Cozido (leguminosa)', 'feijao', 'feijao', meal.feijao.grams, s.feijao, 'feijao');

    const notesHtml = (meal.freeNotes||[]).map(n=>`<li${n.req?' class="req"':''}>${n.text}</li>`).join('');

    return `<div class="meal">
      <div class="meal-top">
        <div class="meal-body">
          <div class="m-time">${meal.time||''}</div>
          <div class="m-title">${meal.title}</div>
        </div>
        <div class="m-kcal">${mac.kcal} kcal</div>
      </div>
      <div class="food-lines">${lines}${notesHtml?`<ul class="note-list">${notesHtml}</ul>`:''}</div>
      ${isMeal?`<div class="meal-macros">
        <span><b>${mac.p}g</b> proteína</span>
        <span><b>${mac.c}g</b> carboidrato</span>
        <span><b>${mac.g}g</b> gordura</span>
        <span class="meal-macros-note">clique nos itens pra recalcular · vegetais e fibra não contam calorias</span>
      </div>`:''}
    </div>`;
  }).join('');
}
function renderAll(){
  const day=DAYS[curIdx];
  renderTabs();
  renderHead(day);
  renderMeals(day);
}
function pick(i){ curIdx=i; renderAll(); }
renderAll();
</script>
